<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#102a43">
  <title>AI-CLO EXAM</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://unpqmttdkmmbnmmcfqbj.supabase.co" crossorigin>
  <link rel="stylesheet" href="./assets/css/tokens.css">
  <link rel="stylesheet" href="./assets/css/base.css">
  <link rel="stylesheet" href="./assets/css/layout.css">
  <link rel="stylesheet" href="./assets/css/components.css">
  <link rel="stylesheet" href="./assets/css/editor.css">
  <link rel="stylesheet" href="./assets/css/live.css">
  <link rel="stylesheet" href="./assets/css/student.css">
  <link rel="stylesheet" href="./assets/css/responsive.css">
</head>
<body>
  <div id="app" class="app-root" aria-live="polite">
    <div class="boot-screen">
      <div class="brand-mark" aria-label="AI-CLO EXAM"><strong>AI-CLO</strong><span>EXAM</span></div>
      <div class="spinner" aria-hidden="true"></div>
      <p>Đang khởi tạo hệ thống thi…</p>
    </div>
  </div>
  <div id="toast-root" class="toast-root" aria-live="assertive"></div>
  <div id="modal-root"></div>
  <script>
    (function () {
      var ready = false;
      function host() { return document.getElementById('app'); }
      function escapeHtml(value) {
        return String(value == null ? '' : value).replace(/[&<>"']/g, function (ch) {
          return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch];
        });
      }
      function fail(message) {
        if (ready) return;
        var root = host();
        if (!root) return;
        ready = true;
        root.innerHTML = '<div class="boot-screen"><div class="brand-mark"><strong>AI-CLO</strong><span>EXAM</span></div><h2>Không thể khởi tạo hệ thống thi</h2><p>' + escapeHtml(message || 'Không tải được ứng dụng. Hãy tải lại trang hoặc kiểm tra kết nối mạng.') + '</p><button class="btn btn-secondary" type="button" onclick="location.reload()">Tải lại trang</button></div>';
      }
      window.__examBootReady = function () { ready = true; };
      window.__examBootFail = fail;
      window.addEventListener('error', function (event) {
        var detail = event && event.message ? event.message : 'Có lỗi khi tải mã nguồn ứng dụng.';
        if (event && event.filename) detail += ' | ' + event.filename + ':' + (event.lineno || '?') + ':' + (event.colno || '?');
        fail(detail);
      });
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event && event.reason;
        fail(reason && reason.message ? reason.message : String(reason || 'Có lỗi khi khởi tạo ứng dụng.'));
      });
      setTimeout(function () {
        fail('Khởi tạo quá lâu. Có thể một thư viện hoặc kết nối Supabase chưa tải được.');
      }, 12000);
    }());
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0" onerror="window.__examBootFail && window.__examBootFail('Không tải được thư viện Supabase từ CDN.')"></script>
  <script type="module" src="./assets/js/app.js?v=1.0.3"></script>
</body>
</html>
